spring.application.name=service-gestion
server.port=8083

# ── Base de Datos ─────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/db_gestion_donaciones?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── URL interna del service-donante ──────────────────────────────────────────
# Se usa en DonacionService para la comunicación entre microservicios
donante.service.url=http://localhost:8082
