<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abrázame — Catálogo de necesidades</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--green:#8DC5A0;--green-dark:#6aaa85;--green-light:#EBF5EE;--lilac:#C4A8D4;--lilac-dark:#a888be;
      --gray:#6B7280;--border:#E5E7EB;--text:#1E293B;--light:#F9FAFB;--white:#fff;--radius:12px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Nunito',sans-serif;background:#F3F4F6;min-height:100vh;}
    nav{background:var(--green);padding:0 32px;display:flex;align-items:center;gap:4px;}
    nav a{color:rgba(255,255,255,0.85);font-size:0.82rem;font-weight:700;letter-spacing:0.06em;padding:14px 18px;display:block;text-transform:uppercase;text-decoration:none;transition:all 0.2s;}
    nav a:hover,nav a.active{color:#fff;background:rgba(255,255,255,0.12);}
    nav a.active{background:var(--lilac);}
    .page-header{background:var(--white);padding:28px 48px;border-bottom:1px solid var(--border);}
    .page-header h1{font-size:1.6rem;font-weight:900;color:var(--text);}
    .page-header p{color:var(--gray);margin-top:4px;font-size:0.92rem;}
    .content{max-width:1100px;margin:0 auto;padding:32px 24px 80px;}

    /* Paso a paso */
    .steps{display:flex;align-items:center;gap:8px;margin-bottom:28px;flex-wrap:wrap;}
    .step{display:flex;align-items:center;gap:6px;font-size:0.82rem;color:var(--gray);}
    .step.active{color:var(--green-dark);font-weight:800;}
    .step.done{color:var(--green);font-weight:700;}
    .step-num{width:24px;height:24px;border-radius:50%;background:var(--border);color:var(--gray);font-size:0.75rem;font-weight:800;display:flex;align-items:center;justify-content:center;}
    .step.active .step-num{background:var(--green);color:#fff;}
    .step.done .step-num{background:var(--green-light);color:var(--green-dark);}
    .step-sep{color:var(--border);font-size:1.2rem;}

    /* Breadcrumb */
    .breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:0.82rem;flex-wrap:wrap;}
    .breadcrumb span{color:var(--gray);}
    .breadcrumb button{background:none;border:none;color:var(--green-dark);font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;font-size:0.82rem;padding:0;}
    .breadcrumb button:hover{text-decoration:underline;}

    /* Grid de categorías */
    .cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:32px;}
    .cat-card{background:var(--white);border:2px solid var(--border);border-radius:var(--radius);padding:20px 16px;text-align:center;cursor:pointer;transition:all 0.2s;}
    .cat-card:hover{border-color:var(--green);box-shadow:0 4px 16px rgba(141,197,160,0.2);transform:translateY(-2px);}
    .cat-card.selected{border-color:var(--green);background:var(--green-light);}
    .cat-icon{font-size:2rem;margin-bottom:8px;}
    .cat-name{font-weight:800;font-size:0.88rem;color:var(--text);}
    .cat-count{font-size:0.75rem;color:var(--gray);margin-top:3px;}

    /* Chips de subcategoría y edad */
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
    .chip{padding:7px 18px;border-radius:50px;border:2px solid var(--border);background:var(--white);font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:700;color:var(--gray);cursor:pointer;transition:all 0.2s;}
    .chip:hover{border-color:var(--green);color:var(--green-dark);}
    .chip.active{background:var(--green);color:#fff;border-color:var(--green);}
    .chip-label{font-size:0.78rem;font-weight:800;color:var(--gray);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;margin-top:16px;}

    /* Cards de artículos */
    .art-grid{display:grid;gap:16px;}
    .art-card{background:var(--white);border-radius:var(--radius);border-left:4px solid var(--green);padding:20px 24px;box-shadow:0 2px 8px rgba(0,0,0,0.05);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
    .art-info h3{font-size:1rem;font-weight:800;color:var(--text);margin-bottom:4px;}
    .art-meta{font-size:0.78rem;color:var(--gray);}
    .art-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:50px;font-size:0.72rem;font-weight:800;margin-left:8px;}
    .badge-alta{background:#FEE2E2;color:#991B1B;}
    .badge-media{background:#FEF3C7;color:#92400E;}
    .badge-baja{background:#F0FDF4;color:#166534;}
    .progress-wrap{margin-top:10px;}
    .progress-bar{height:6px;background:#F3F4F6;border-radius:50px;overflow:hidden;width:280px;max-width:100%;}
    .progress-fill{height:100%;border-radius:50px;background:linear-gradient(90deg,var(--green),var(--green-dark));}
    .progress-fill.urgente{background:linear-gradient(90deg,#F87171,#DC2626);}
    .progress-fill.medio{background:linear-gradient(90deg,#FBBF24,#D97706);}
    .progress-text{font-size:0.75rem;color:var(--gray);margin-top:4px;}
    .donar-btn{background:var(--lilac);color:#fff;border:none;border-radius:50px;padding:11px 28px;font-family:'Nunito',sans-serif;font-size:0.88rem;font-weight:800;cursor:pointer;white-space:nowrap;transition:all 0.2s;}
    .donar-btn:hover{background:var(--lilac-dark);transform:translateY(-1px);}
    .empty{text-align:center;padding:48px;color:var(--gray);}
    .empty h3{font-size:1.1rem;font-weight:700;margin-bottom:8px;}
    .section-title{font-size:1rem;font-weight:800;color:var(--text);margin-bottom:16px;}

    /* Responsive */
    @media(max-width:600px){.art-card{flex-direction:column;align-items:flex-start;}.progress-bar{width:100%;}.cat-grid{grid-template-columns:repeat(3,1fr);}}
  </style>
</head>
<body>
<nav>
  <a href="index.html" style="margin-right:auto;display:flex;align-items:center;gap:6px;">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" style="width:28px;height:28px;vertical-align:middle;">
      <circle cx="100" cy="38" r="14" fill="white"/>
      <path d="M100 52 Q120 70 115 95 Q100 85 85 95 Q80 70 100 52Z" fill="white"/>
      <circle cx="48" cy="128" r="14" fill="white"/>
      <path d="M48 142 Q28 145 22 168 Q40 172 65 160 Q62 148 48 142Z" fill="white"/>
      <circle cx="152" cy="128" r="14" fill="white"/>
      <path d="M152 142 Q172 145 178 168 Q160 172 135 160 Q138 148 152 142Z" fill="white"/>
      <path d="M72 55 Q40 80 50 125" stroke="white" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M60 148 Q75 180 100 185" stroke="white" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M128 55 Q160 80 150 125" stroke="white" stroke-width="10" fill="none" stroke-linecap="round"/>
      <circle cx="100" cy="105" r="18" fill="white"/>
      <path d="M91 110 Q100 118 109 110" stroke="#8DC5A0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
    Inicio
  </a>
  <a href="catalogo.html" class="active">Catálogo</a>
  <a href="mapa_entregas.html">Mapa Entregas</a>
</nav>

<div class="page-header">
  <h1>Catalogo de necesidades</h1>
  <p>Selecciona que quieres donar — elige categoria, tipo y rango de edad.</p>
</div>

<div class="content">

  <!-- Pasos -->
  <div class="steps">
    <div class="step" id="step1"><div class="step-num">1</div> Categoria</div>
    <span class="step-sep">›</span>
    <div class="step" id="step2"><div class="step-num">2</div> Tipo</div>
    <span class="step-sep">›</span>
    <div class="step" id="step3"><div class="step-num">3</div> Edad y articulo</div>
  </div>

  <!-- Breadcrumb -->
  <div class="breadcrumb" id="breadcrumb" style="display:none;">
    <button onclick="resetTodo()">Todas las categorias</button>
    <span id="bc_sep1" style="display:none;">›</span>
    <button id="bc_cat" onclick="volverACat()" style="display:none;"></button>
    <span id="bc_sep2" style="display:none;">›</span>
    <span id="bc_sub" style="display:none;"></span>
  </div>

  <!-- PASO 1: Categorías -->
  <div id="panelCats">
    <div class="section-title">Selecciona una categoria</div>
    <div class="cat-grid" id="catGrid"></div>
  </div>

  <!-- PASO 2: Subcategorías + Edad -->
  <div id="panelSub" style="display:none;">
    <div class="section-title" id="subTitle"></div>
    <div class="chip-label">Tipo de articulo</div>
    <div class="chips" id="subChips"></div>
    <div class="chip-label">Rango de edad</div>
    <div class="chips" id="edadChips"></div>
    <div class="art-grid" id="artGrid"></div>
  </div>

</div>

<script>
const GESTION_API = 'http://localhost:8083';
let todos = [], catSel = null, subSel = 'todos', edadSel = 'todas';

const CAT_ICONS = {
  'Ropa': '👕', 'Calzado': '👟', 'Juguetes': '🧸',
  'Útiles escolares': '📚', 'Libros': '📖', 'Higiene': '🧴'
};

const EDADES = ['0-2 años','3-6 años','7-12 años','13-17 años'];

async function cargarCatalogo() {
  try {
    const res = await fetch('/catalogo');
    todos = await res.json();
    renderCats();
  } catch(e) {
    document.getElementById('catGrid').innerHTML = '<p style="color:#999;padding:20px;">No se pudo cargar el catalogo. Verifica que service-catalogo este corriendo.</p>';
  }
}

function renderCats() {
  // Agrupar por categoría
  const cats = {};
  todos.filter(a=>a.activo).forEach(a=>{
    if(!cats[a.categoria]) cats[a.categoria]=0;
    cats[a.categoria]++;
  });
  document.getElementById('catGrid').innerHTML = Object.entries(cats).map(([cat,count])=>`
    <div class="cat-card" onclick="selCat('${cat}')">
      <div class="cat-icon">${CAT_ICONS[cat]||'📦'}</div>
      <div class="cat-name">${cat}</div>
      <div class="cat-count">${count} articulos</div>
    </div>
  `).join('');
  document.getElementById('panelCats').style.display='block';
  document.getElementById('panelSub').style.display='none';
  document.getElementById('breadcrumb').style.display='none';
  actualizarSteps(1);
}

function selCat(cat) {
  catSel = cat; subSel='todos'; edadSel='todas';
  const arts = todos.filter(a=>a.activo && a.categoria===cat);

  // Subcategorías
  const subs = [...new Set(arts.map(a=>a.subcategoria))];
  const edades = [...new Set(arts.map(a=>a.rangoEdad))].sort();

  document.getElementById('subTitle').textContent = CAT_ICONS[cat]+' '+cat;
  document.getElementById('panelCats').style.display='none';
  document.getElementById('panelSub').style.display='block';

  // Breadcrumb
  document.getElementById('breadcrumb').style.display='flex';
  document.getElementById('bc_sep1').style.display='inline';
  document.getElementById('bc_cat').style.display='inline';
  document.getElementById('bc_cat').textContent=cat;
  document.getElementById('bc_sep2').style.display='none';
  document.getElementById('bc_sub').style.display='none';

  // Chips subcategoría
  document.getElementById('subChips').innerHTML =
    `<button class="chip active" onclick="selSub('todos',this)">Todos</button>` +
    subs.map(s=>`<button class="chip" onclick="selSub('${s}',this)">${s}</button>`).join('');

  // Chips edad
  document.getElementById('edadChips').innerHTML =
    `<button class="chip active" onclick="selEdad('todas',this)">Todas las edades</button>` +
    EDADES.filter(e=>edades.includes(e)).map(e=>`<button class="chip" onclick="selEdad('${e}',this)">${e}</button>`).join('');

  renderArts();
  actualizarSteps(2);
}

function selSub(sub, btn) {
  subSel = sub;
  document.querySelectorAll('#subChips .chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  // Breadcrumb
  if(sub!=='todos'){
    document.getElementById('bc_sep2').style.display='inline';
    document.getElementById('bc_sub').style.display='inline';
    document.getElementById('bc_sub').textContent=sub;
  } else {
    document.getElementById('bc_sep2').style.display='none';
    document.getElementById('bc_sub').style.display='none';
  }
  renderArts();
}

function selEdad(edad, btn) {
  edadSel = edad;
  document.querySelectorAll('#edadChips .chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderArts();
  if(edad!=='todas') actualizarSteps(3);
}

function renderArts() {
  let arts = todos.filter(a=>a.activo && a.categoria===catSel);
  if(subSel!=='todos') arts = arts.filter(a=>a.subcategoria===subSel);
  if(edadSel!=='todas') arts = arts.filter(a=>a.rangoEdad===edadSel);

  if(!arts.length){
    document.getElementById('artGrid').innerHTML='<div class="empty"><h3>Sin articulos en esta seleccion</h3><p>Prueba con otra edad o tipo.</p></div>';
    return;
  }

  document.getElementById('artGrid').innerHTML = arts.map(a=>{
    const pct = a.metaStock>0 ? Math.min(100,Math.round((a.stockActual/a.metaStock)*100)) : 0;
    const clase = pct<30?'urgente':pct<70?'medio':'';
    const badgeCls = a.prioridad==='Alta'?'badge-alta':a.prioridad==='Media'?'badge-media':'badge-baja';
    return `<div class="art-card">
      <div class="art-info">
        <h3>${a.nombre}<span class="art-badge ${badgeCls}">${a.prioridad} prioridad</span></h3>
        <div class="art-meta">Edad: ${a.rangoEdad} · Categoria: ${a.subcategoria||a.categoria}</div>
        ${a.descripcion?`<div style="font-size:0.8rem;color:var(--gray);margin-top:6px;">${a.descripcion}</div>`:''}
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill ${clase}" style="width:${pct}%"></div></div>
          <div class="progress-text">${a.stockActual} comprometidos · Meta: ${a.metaStock} · ${pct}%</div>
        </div>
      </div>
      <button class="donar-btn" onclick="donar(${JSON.stringify(a).replace(/"/g,'&quot;')})">Donar este articulo</button>
    </div>`;
  }).join('');
}

function donar(art) {
  const enc = encodeURIComponent(JSON.stringify(art));
  window.location.href = 'formulario_donante.html?articulo=' + enc;
}

function resetTodo() {
  catSel=null; subSel='todos'; edadSel='todas';
  renderCats();
}

function volverACat() {
  subSel='todos'; edadSel='todas';
  selCat(catSel);
}

function actualizarSteps(paso) {
  document.querySelectorAll('.step').forEach((s,i)=>{
    s.classList.remove('active','done');
    if(i+1<paso) s.classList.add('done');
    else if(i+1===paso) s.classList.add('active');
  });
}

cargarCatalogo();
</script>
</body>
</html>
